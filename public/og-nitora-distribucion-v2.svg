<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Nítora — diagnóstico hotelero en cinco días</title>
  <desc id="desc">Tarjeta social de Nítora para su diagnóstico de distribución y reportería hotelera.</desc>
  <defs>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#10282D" stroke-width="1" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#F5F1E9"/>
  <rect x="744" width="456" height="630" fill="url(#grid)"/>

  <text x="68" y="82" fill="#10282D" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="500">Nítora</text>
  <rect x="68" y="111" width="52" height="3" fill="#C65F34"/>

  <text x="68" y="180" fill="#9F4525" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2.2">DIAGNÓSTICO DE DISTRIBUCIÓN Y REPORTERÍA</text>
  <text x="68" y="268" fill="#10282D" font-family="Georgia, 'Times New Roman', serif" font-size="67" font-weight="400">Decisiones claras</text>
  <text x="68" y="342" fill="#10282D" font-family="Georgia, 'Times New Roman', serif" font-size="67" font-weight="400">para tu hotel,</text>
  <text x="68" y="416" fill="#C65F34" font-family="Georgia, 'Times New Roman', serif" font-size="67" font-weight="400">en cinco días.</text>

  <text x="70" y="506" fill="#42565A" font-family="Arial, Helvetica, sans-serif" font-size="20">Sin acceso al PMS · Sin integraciones · Archivos validados antes de cobrar</text>
  <text x="70" y="570" fill="#10282D" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">NITORA.ONLINE</text>

  <g transform="translate(798 112)">
    <rect width="334" height="402" fill="#FFFDF8" stroke="#10282D" stroke-opacity="0.18"/>
    <rect x="0" y="30" width="4" height="342" fill="#C65F34"/>
    <text x="34" y="48" fill="#9F4525" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">CASO HIPOTÉTICO</text>
    <text x="34" y="84" fill="#10282D" font-family="Georgia, 'Times New Roman', serif" font-size="29">Lectura de distribución</text>
    <line x1="34" y1="107" x2="300" y2="107" stroke="#10282D" stroke-opacity="0.18"/>

    <text x="34" y="143" fill="#6A7A7E" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">TRES DECISIONES PRIORIZADAS</text>

    <g transform="translate(34 168)">
      <text x="0" y="18" fill="#C65F34" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">01</text>
      <text x="42" y="18" fill="#10282D" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Qué corregir ahora</text>
      <line x1="0" y1="38" x2="266" y2="38" stroke="#10282D" stroke-opacity="0.13"/>

      <text x="0" y="78" fill="#C65F34" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">02</text>
      <text x="42" y="78" fill="#10282D" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Qué medir durante 30 días</text>
      <line x1="0" y1="98" x2="266" y2="98" stroke="#10282D" stroke-opacity="0.13"/>

      <text x="0" y="138" fill="#C65F34" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">03</text>
      <text x="42" y="138" fill="#10282D" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Qué no tocar todavía</text>
      <line x1="0" y1="158" x2="266" y2="158" stroke="#10282D" stroke-opacity="0.13"/>
    </g>

    <g transform="translate(34 352)">
      <line x1="0" y1="0" x2="58" y2="0" stroke="#7D927D" stroke-width="3"/>
      <line x1="67" y1="0" x2="125" y2="0" stroke="#10282D" stroke-opacity="0.35" stroke-width="3"/>
      <line x1="134" y1="0" x2="192" y2="0" stroke="#C65F34" stroke-width="3"/>
      <line x1="201" y1="0" x2="266" y2="0" stroke="#10282D" stroke-opacity="0.18" stroke-width="3"/>
      <text x="0" y="24" fill="#6A7A7E" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1">EVIDENCIA · SUPUESTOS · CONFIANZA</text>
    </g>
  </g>
</svg>
